services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sri_db}
      POSTGRES_USER: ${POSTGRES_USER:-sri_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sri_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sri_user} -d ${POSTGRES_DB:-sri_db}"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build: .
    working_dir: /app
    ports:
      - "8888:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sri_db}
      POSTGRES_USER: ${POSTGRES_USER:-sri_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sri_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-django-insecure-aw^%n+s&8oi0yta#=*6lfnpaeuu^6w(r1e)@bicz$@1l3ibo1j}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://localhost,https://127.0.0.1}
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data: 