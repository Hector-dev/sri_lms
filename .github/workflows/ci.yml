name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sri_db
          POSTGRES_USER: sri_user
          POSTGRES_PASSWORD: sri_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sri_user -d sri_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SECRET_KEY: ci-only-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: sri_db
      POSTGRES_USER: sri_user
      POSTGRES_PASSWORD: sri_pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare runtime directories
        run: mkdir -p logs temp static
      - name: Django checks
        run: python manage.py check
      - name: Tests
        run: python manage.py test
