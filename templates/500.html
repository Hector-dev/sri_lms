{% extends 'base.html' %}

{% block title %}Error del servidor - SRI Learning{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <div class="card shadow rounded-4 border-0">
            <div class="card-body py-5">
                <div class="mb-4">
                    <h1 class="display-1 fw-bold text-danger">500</h1>
                    <h2 class="fw-bold mb-3">Error del servidor</h2>
                    <p class="lead text-muted mb-4">Algo salió mal en nuestro servidor. Por favor, intenta de nuevo más tarde.</p>
                </div>
                
                <div class="mb-4">
                    <img src="https://placehold.co/400x300/dc3545/FFF?text=500" alt="Error 500" class="img-fluid rounded-4 shadow-sm">
                </div>
                
                <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                    <a href="{% url 'home' %}" class="btn btn-primary btn-lg">Volver al inicio</a>
                    <button onclick="window.location.reload()" class="btn btn-outline-primary btn-lg">Recargar página</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
